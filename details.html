<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8" />
    <meta http equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/bootstrap.min.css" />
    <link rel="stylesheet" href="Css/bootstrap-Icon.min.css" />
    <link rel="stylesheet" href="Css/newAnimate.css" />
    <link rel="stylesheet" href="Css/Style.css" />
    <link rel="shortcut icon" href="Image/favicon.ico" type="image/x-icon">
    <title>Series Details</title>
    <style>
        
    </style>
</head>

<body class="bg-light">
    <div class="Navbar-class">
        <div class="container py-md-4 py-3">
            <div class="row">
                <div class="col-md-8 col-3">
                    <nav class="navbar navbar-expand-lg">
                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <ul class="navbar-nav">
                                <li class="nav-item active">
                                    <a class="nav-link" href="index.html">Home</a>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </div>
                <div class="col-md-3 col-6"></div>
                <div class="col-md-1 col-3">
                    <div class="logo-header">
                        <a href="index.html"><img class="w-50" src="Image/logo.png" alt="pic"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="mainContent">
        <!-- Hero Section -->
        <section class="series-hero mb-5">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-4 text-center mb-4 mb-md-0">
                        <img id="seriesPoster" src="" alt="Poster" class="poster-img rounded-3">
                    </div>
                    <div class="col-md-8 text-center text-md-start">
                        <h1 id="seriesTitle" class="display-4 fw-bold mb-3">Loading...</h1>
                        <div id="heroBadges" class="d-flex flex-wrap justify-content-center justify-content-md-start gap-2 mb-4">
                            <!-- Badges like Type, Language, Status will go here -->
                        </div>
                        <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-3">
                            <div class="text-center">
                                <span class="info-label d-block">Rating</span>
                                <span id="seriesRating" class="fs-4 fw-bold text-warning">N/A</span>
                            </div>
                            <div class="text-center">
                                <span class="info-label d-block">Premiered</span>
                                <span id="seriesPremiered" class="fs-5 fw-bold">N/A</span>
                            </div>
                            <div class="text-center">
                                <span class="info-label d-block">Runtime</span>
                                <span id="seriesRuntime" class="fs-5 fw-bold">N/A</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="pb-5">
            <div class="container">
                <div class="row g-4">
                    <!-- Left Column: Summary and Main Info -->
                    <div class="col-lg-8">
                        <div class="card detail-card shadow-sm p-4 mb-4">
                            <h4 class="fw-bold mb-3"><i class="bi bi-justify-left me-2 text-primary"></i>Summary</h4>
                            <div id="seriesSummary" class="summary-box text-muted">
                                Loading summary...
                            </div>
                        </div>

                        <div class="card detail-card shadow-sm p-4">
                            <h4 class="fw-bold mb-4"><i class="bi bi-info-circle me-2 text-primary"></i>General Information</h4>
                            <div id="generalInfo" class="row g-3">
                                <!-- General info fields will be injected here -->
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Technical and Links -->
                    <div class="col-lg-4">
                        <div class="card detail-card shadow-sm p-4 mb-4">
                            <h4 class="fw-bold mb-4"><i class="bi bi-gear me-2 text-primary"></i>Technical Details</h4>
                            <div id="technicalInfo" class="row g-3">
                                <!-- Technical info fields will be injected here -->
                            </div>
                        </div>

                        <div class="card detail-card shadow-sm p-4 mb-4">
                            <h4 class="fw-bold mb-4"><i class="bi bi-link-45deg me-2 text-primary"></i>External Links</h4>
                            <div id="externalLinks" class="d-grid gap-2">
                                <!-- Links will be injected here -->
                            </div>
                        </div>

                        <div class="card detail-card shadow-sm p-4">
                            <h4 class="fw-bold mb-4"><i class="bi bi-database me-2 text-primary"></i>Database Info</h4>
                            <div id="databaseInfo" class="row g-2">
                                <!-- Local DB info will be injected here -->
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-5">
                    <a href="index.html" class="btn btn-outline-primary btn-lg px-5 rounded-pill">Back to Home</a>
                </div>
            </div>
        </section>
    </div>

    <script src="js/bootstrap.min.js"></script>
    <script src="js/details.js"></script>
</body>
</html>
